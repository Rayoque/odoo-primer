[options]
; Lab defaults. Change admin_passwd before any network exposure.
admin_passwd = primer-master-change-me
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
; Leave workers at 0 for a single-process lab (official image default).
; Do not enable proxy_mode unless you put nginx in front.
without_demo = False
logfile = /var/log/odoo/odoo.log
